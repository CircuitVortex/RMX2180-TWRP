name: Build TWRP RMX2180

on:
  workflow_dispatch:

env:
  DEVICE: RMX2180
  MANIFEST_URL: https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git
  MANIFEST_BRANCH: twrp-11

jobs:
  build:
    name: Build TWRP recovery (twrp-11)
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Check out device tree repository
        uses: actions/checkout@v4

      - name: Maximize build space + add swap
        run: |
          set -e
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          sudo fallocate -l 16G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          df -h /

      - name: Install build dependencies + repo
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison gperf build-essential \
            zip curl zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 \
            lib32ncurses-dev x11proto-core-dev libx11-dev lib32z-dev \
            libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig
          mkdir -p "$HOME/bin"
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > "$HOME/bin/repo"
          chmod a+x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global color.ui false

      - name: Initialize and sync twrp-11 source
        working-directory: ${{ github.workspace }}
        run: |
          set -e
          mkdir -p twrp && cd twrp
          repo init -u "$MANIFEST_URL" -b "$MANIFEST_BRANCH" --depth=1
          repo sync -c -j$(nproc) --no-clone-bundle --no-tags --force-sync

      - name: Copy device tree into source tree
        run: |
          set -e
          mkdir -p twrp/device/realme
          cp -a device/realme/RMX2180 twrp/device/realme/RMX2180

      - name: Build recovery image
        working-directory: ${{ github.workspace }}/twrp
        run: |
          set -e
          source build/envsetup.sh
          lunch twrp_RMX2180-eng
          mka recoveryimage -j$(nproc)

      - name: Upload recovery.img artifact
        uses: actions/upload-artifact@v4
        with:
          name: TWRP-RMX2180
          path: twrp/out/target/product/RMX2180/recovery.img
          if-no-files-found: error
