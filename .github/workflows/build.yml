name: Build TWRP RMX2180

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout device tree
        uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison build-essential \
            zip curl zlib1g-dev libc6-dev-i386 libncurses5 lib32ncurses-dev \
            x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev \
            libxml2-utils xsltproc unzip fontconfig python3

      - name: Install repo
        run: |
          curl https://storage.googleapis.com/git-repo-downloads/repo > \~/repo
          chmod a+x \~/repo
          sudo mv \~/repo /usr/local/bin/repo

      - name: Init TWRP source (twrp-11)
        run: |
          mkdir twrp && cd twrp
          repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-11 --depth=1
          repo sync -c -j$(nproc) --force-sync --no-clone-bundle --no-tags

      - name: Place device tree
        run: |
          mkdir -p twrp/device/realme
          # If this repo IS the device tree root:
          cp -a . twrp/device/realme/RMX2180
          # Remove workflow/git junk from device path if needed
          rm -rf twrp/device/realme/RMX2180/.git twrp/device/realme/RMX2180/.github

      - name: Build recovery
        run: |
          cd twrp
          export ALLOW_MISSING_DEPENDENCIES=true
          source build/envsetup.sh
          lunch twrp_RMX2180-eng
          mka recoveryimage -j$(nproc)

      - name: Upload recovery.img
        uses: actions/upload-artifact@v4
        with:
          name: TWRP-RMX2180
          path: twrp/out/target/product/RMX2180/recovery.img
