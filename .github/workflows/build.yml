name: Build TWRP RMX2180

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  MANIFEST_URL: https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git
  MANIFEST_BRANCH: twrp-11
  DEVICE_PATH: device/realme/RMX2180
  DEVICE_NAME: RMX2180

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout device tree
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git-core gnupg flex bison build-essential \
            zip curl zlib1g-dev libc6-dev-i386 \
            libncurses-dev lib32z1-dev libgl1-mesa-dev \
            libxml2-utils xsltproc unzip fontconfig \
            python3 python-is-python3 bc ccache \
            libssl-dev libelf-dev rsync

      - name: Install repo
        run: |
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo \
            -o /tmp/repo
          chmod +x /tmp/repo
          sudo install /tmp/repo /usr/local/bin/repo
          repo --version

      - name: Validate device tree
        run: |
          test -f "$DEVICE_PATH/AndroidProducts.mk"
          test -f "$DEVICE_PATH/BoardConfig.mk"
          test -f "$DEVICE_PATH/device.mk"
          echo "Device tree: $DEVICE_PATH"
          ls -la "$DEVICE_PATH"

      - name: Initialize TWRP source
        run: |
          mkdir -p twrp
          cd twrp
          repo init \
            -u "$MANIFEST_URL" \
            -b "$MANIFEST_BRANCH" \
            --depth=1
          repo sync -c -j2 \
            --force-sync \
            --no-clone-bundle \
            --no-tags

      - name: Install device tree
        run: |
          mkdir -p "twrp/$DEVICE_PATH"
          cp -a "$DEVICE_PATH/." "twrp/$DEVICE_PATH/"

      - name: Build recovery
        run: |
          cd twrp
          export ALLOW_MISSING_DEPENDENCIES=true
          source build/envsetup.sh
          lunch twrp_RMX2180-eng
          mka recoveryimage -j2

      - name: Locate recovery image
        id: image
        run: |
          IMAGE="$(find twrp/out/target/product \
            -type f -name recovery.img -print -quit)"

          if [ -z "$IMAGE" ]; then
            echo "::error::Build finished without recovery.img"
            find twrp/out/target/product -type f \
              \( -name '*recovery*' -o -name 'boot.img' \) \
              2>/dev/null | head -100
            exit 1
          fi

          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          ls -lh "$IMAGE"

      - name: Upload recovery image
        uses: actions/upload-artifact@v4
        with:
          name: TWRP-RMX2180
          path: ${{ steps.image.outputs.image }}
          if-no-files-found: error
          retention-days: 7
